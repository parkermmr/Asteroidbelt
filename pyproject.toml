[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asteroidbelt"
version = "1.0.0"
description = "Named jobs with ttls, eviction, resource budgets and a durable journal on local processes, threads or Ray"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Parker" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
ray = ["ray[default]>=2.40"]
kafka = ["aiokafka>=0.11"]
s3 = ["boto3>=1.34"]
serialize = ["cloudpickle>=3.0"]
arrow = ["pyarrow>=15.0"]
control = ["plyght[web]>=1.0"]
all = [
    "ray[default]>=2.40",
    "aiokafka>=0.11",
    "boto3>=1.34",
    "cloudpickle>=3.0",
    "pyarrow>=15.0",
    "plyght[web]>=1.0",
]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/parkermmr/asteroidbelt"
Issues = "https://github.com/parkermmr/asteroidbelt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/asteroidbelt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["asteroidbelt"]
branch = true
